<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CubeCrew — La communauté Geometry Dash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root{
    --bg:#020617; --surface:#0f172a; --surface2:#111827;
    --border:#1e293b; --border-hover:#475569;
    --text:#f1f5f9; --muted:#94a3b8; --muted2:#64748b;
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,.15);
    --pink:#f472b6; --pink-dim:rgba(244,114,182,.15);
    --violet:#a78bfa; --violet-dim:rgba(167,139,250,.15);
    --amber:#fbbf24; --amber-dim:rgba(251,191,36,.15);
    --emerald:#34d399; --emerald-dim:rgba(52,211,153,.15);
    --red:#f87171; --red-dim:rgba(248,113,113,.15);
    --blue:#60a5fa; --yellow:#facc15; --orange:#fb923c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,h3,.font-display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a,button,input,textarea,select{font-family:inherit;}
  button{cursor:pointer;background:none;border:none;color:inherit;}
  input,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:14px;}
  input:focus,textarea:focus{outline:2px solid var(--cyan);border-color:transparent;}
  .icon{width:16px;height:16px;flex-shrink:0;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px;}
  .wrap-narrow{max-width:640px;margin:0 auto;padding:0 16px;}
  .wrap-mid{max-width:760px;margin:0 auto;padding:0 16px;}

  /* header */
  header{position:sticky;top:0;z-index:30;background:rgba(2,6,23,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  header .bar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .logo{display:flex;align-items:center;gap:8px;}
  .logo-box{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;}
  .logo span{font-weight:700;font-size:18px;letter-spacing:-.02em;}
  .hdr-actions{display:flex;align-items:center;gap:8px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);color:var(--text);transition:.15s;}
  .btn:hover{border-color:var(--border-hover);}
  .btn-primary{background:var(--cyan);color:#020617;border-color:var(--cyan);}
  .btn-primary:hover{background:#67e8f9;border-color:#67e8f9;}
  .btn-light{background:#f1f5f9;color:#0f172a;border-color:#f1f5f9;}
  .btn-light:hover{background:#fff;}
  .btn-danger{color:var(--red);border-color:#7f1d1d;background:rgba(127,29,29,.25);}
  .btn-danger:hover{background:rgba(127,29,29,.5);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn[disabled]{opacity:.3;cursor:not-allowed;}
  .icon-btn{padding:8px;border-radius:8px;color:var(--muted2);}
  .icon-btn:hover{color:var(--text);}

  .avatar{border-radius:999px;background:linear-gradient(135deg,#334155,#1e293b);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);flex-shrink:0;}

  /* feed */
  main{padding:32px 0 60px;}
  .feed-head h1{font-size:26px;font-weight:700;margin:0 0 4px;}
  .feed-head p{color:var(--muted);margin:0;font-size:14px;}
  .controls{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0;}
  .search-box{position:relative;flex:1;min-width:220px;}
  .search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2);}
  .search-box input{width:100%;padding-left:36px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
  .chip:hover{border-color:var(--border-hover);}
  .chip.active{border-color:transparent;}
  .chip.active.light{background:#f1f5f9;color:#0f172a;}

  .grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr;}}

  .card{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--border);transition:.15s;cursor:pointer;}
  .card:hover{border-color:var(--border-hover);}
  .card-feature{background:var(--amber);color:#020617;text-align:center;font-size:10px;font-weight:700;letter-spacing:.15em;padding:4px 0;}
  .card-thumb{position:relative;height:128px;display:flex;align-items:center;justify-content:center;}
  .card-thumb .icon{width:48px;height:48px;color:rgba(255,255,255,.28);}
  .badge{position:absolute;top:8px;display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(2,6,23,.55);backdrop-filter:blur(4px);color:#fff;}
  .badge .icon{width:12px;height:12px;color:inherit;}
  .badge-left{left:8px;}
  .badge-right{right:8px;}
  .card-body{padding:14px;}
  .card-title{font-weight:600;font-size:15px;line-height:1.35;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-author{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .card-stats{display:flex;gap:14px;font-size:12px;color:var(--muted2);}
  .card-stats span{display:flex;align-items:center;gap:4px;}
  .card-stats .icon{width:13px;height:13px;}
  .progress{height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:10px;}
  .progress-fill{height:100%;}
  .empty{text-align:center;padding:80px 20px;color:var(--muted2);border:1px dashed var(--border);border-radius:12px;}

  /* detail */
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:16px;}
  .back-link:hover{color:var(--text);}
  .detail-hero{height:220px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;}
  .detail-hero .icon{width:64px;height:64px;color:rgba(255,255,255,.28);}
  .detail-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:20px;}
  .detail-title-row h1{font-size:24px;margin:0;}
  .detail-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:8px;}
  .detail-desc{color:#cbd5e1;line-height:1.6;margin:16px 0;}
  .detail-actions{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .like-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);}
  .like-btn.liked{border-color:var(--pink);background:var(--pink-dim);color:var(--pink);}
  .stat-inline{display:flex;align-items:center;gap:6px;color:var(--muted2);font-size:13px;}

  .comments{border-top:1px solid var(--border);padding-top:20px;}
  .comments h2{font-size:16px;margin:0 0 16px;}
  .comment{display:flex;gap:10px;margin-bottom:14px;}
  .comment-name{font-weight:600;font-size:13px;}
  .comment-date{font-size:11px;color:var(--muted2);margin-left:6px;}
  .comment-text{font-size:13px;color:#cbd5e1;margin:2px 0 0;}
  .comment-form{display:flex;gap:8px;}
  .comment-form input{flex:1;}

  /* forms */
  .field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  .field textarea{width:100%;resize:vertical;}
  .field input{width:100%;}
  .cat-picker,.grad-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .cat-opt{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--muted);}
  .cat-opt.active{border-color:transparent;}
  .swatch{width:34px;height:34px;border-radius:999px;border:2px solid transparent;}
  .swatch.active{border-color:#f1f5f9;box-shadow:0 0 0 2px var(--bg);}
  .range-row{display:flex;flex-direction:column;gap:8px;}
  input[type=range]{width:100%;accent-color:var(--cyan);}

  /* profile */
  .profile-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .profile-avatar{width:64px;height:64px;border-radius:999px;background:linear-gradient(135deg,var(--cyan),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;}
  .profile-name{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;}
  .profile-joined{font-size:12px;color:var(--muted2);margin-top:2px;}
  .bio-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
  .bio-row p{color:var(--muted);font-size:13px;margin:0;}
  .link-btn{color:var(--cyan);font-size:12px;font-weight:600;text-decoration:none;}
  .link-btn:hover{text-decoration:underline;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .stat-card .num{font-size:20px;font-weight:700;}
  .stat-card .lbl{font-size:11px;color:var(--muted2);margin-top:2px;}
  .mini-card{position:relative;}
  .mini-card .del{position:absolute;top:8px;right:8px;padding:6px;border-radius:999px;background:rgba(2,6,23,.7);color:var(--red);z-index:2;}
  .mini-card .del:hover{background:rgba(127,29,29,.7);}

  /* admin */
  .admin-title{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;margin-bottom:24px;}
  .admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:32px;}
  @media(min-width:640px){.admin-stats{grid-template-columns:repeat(4,1fr);}}
  .astat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .astat .icon{width:16px;height:16px;color:var(--cyan);margin-bottom:8px;}
  .astat .num{font-size:20px;font-weight:700;}
  .astat .lbl{font-size:11px;color:var(--muted2);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:var(--surface);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  th{text-align:left;padding:10px 14px;font-weight:600;}
  td{padding:10px 14px;border-top:1px solid var(--border);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:32px;}
  .row-user{display:flex;align-items:center;gap:8px;}
  .actions-cell{text-align:right;white-space:nowrap;}
  .actions-cell .btn{margin-left:6px;}
  h2.section-title{font-size:16px;margin:0 0 12px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:380px;padding:20px;position:relative;}
  .modal .close-x{position:absolute;top:12px;right:12px;color:var(--muted2);}
  .tabs2{display:flex;gap:8px;margin-bottom:18px;}
  .tab2{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);}
  .tab2.active{background:var(--cyan);color:#020617;}
  .acct-row{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;border:1px solid var(--border);text-align:left;margin-bottom:8px;}
  .acct-row:hover{border-color:var(--border-hover);}
  .acct-name{font-size:13px;display:flex;align-items:center;gap:5px;}
  .acct-sub{font-size:11px;color:var(--muted2);}
  .hint{font-size:12px;color:var(--muted2);margin-bottom:12px;}

  footer{border-top:1px solid var(--border);padding:24px 0;text-align:center;font-size:12px;color:var(--muted2);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#0f172a;font-size:13px;font-weight:600;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:60;}

  .cat-cyan{color:var(--cyan);} .cat-pink{color:var(--pink);} .cat-violet{color:var(--violet);} .cat-amber{color:var(--amber);} .cat-emerald{color:var(--emerald);}
  .catbg-cyan{background:var(--cyan-dim);color:var(--cyan);} .catbg-pink{background:var(--pink-dim);color:var(--pink);}
  .catbg-violet{background:var(--violet-dim);color:var(--violet);} .catbg-amber{background:var(--amber-dim);color:var(--amber);}
  .catbg-emerald{background:var(--emerald-dim);color:var(--emerald);}
  .diff-green{color:#4ade80;} .diff-blue{color:var(--blue);} .diff-yellow{color:var(--yellow);} .diff-orange{color:var(--orange);} .diff-red{color:var(--red);}

  .hide-sm{display:none;}
  @media(min-width:640px){.hide-sm{display:inline-flex;}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- icons ---------- */
const ICONS = {

  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  fileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
  userX: '<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 3.3 1.7"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/>',
};
function icon(name, cls){ return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

/* ---------- data ---------- */
const CATEGORIES = {
  level:   { label:'Niveau', icon:'box', color:'cyan' },
  clip:    { label:'Clip', icon:'video', color:'pink' },
  montage: { label:'Montage', icon:'film', color:'violet' },
  news:    { label:'Actu', icon:'newspaper', color:'amber' },
  tuto:    { label:'Tuto', icon:'grad', color:'emerald' },
};
const THUMB_GRADS = [
  'linear-gradient(135deg,#22d3ee,#2563eb)',
  'linear-gradient(135deg,#f472b6,#c026d3)',
  'linear-gradient(135deg,#a78bfa,#7c3aed)',
  'linear-gradient(135deg,#fbbf24,#ea580c)',
  'linear-gradient(135deg,#34d399,#0d9488)',
  'linear-gradient(135deg,#f87171,#e11d48)',
];
function difficultyMeta(n){
  if(n<=2) return {label:'Facile', cls:'diff-green'};
  if(n<=4) return {label:'Normal', cls:'diff-blue'};
  if(n<=6) return {label:'Difficile', cls:'diff-yellow'};
  if(n<=8) return {label:'Insane', cls:'diff-orange'};
  return {label:'Demon', cls:'diff-red'};
}
function formatCount(n){ return n>=1000 ? (n/1000).toFixed(1).replace('.0','')+'k' : String(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p){ return p + Date.now() + Math.floor(Math.random()*1000); }

let state = {
  users: [
    { id:'u1', username:'Vex_Admin', role:'admin', bio:"Fondateur de CubeCrew. Modération et organisation des events.", banned:false, joined:'2023' },

    { id:'u3', username:'WaveQueen', role:'user', bio:'Clips et montages. Spécialiste des niveaux wave techniques.', banned:false, joined:'2024' },
    { id:'u4', username:'ByteJumper', role:'user', bio:"Débutant, j'apprends le level design pas à pas.", banned:false, joined:'2025' },
    { id:'u5', username:'TrollFace99', role:'user', bio:'', banned:true, joined:'2025' },
  ],
  posts: [
    { id:'p1', title:'Fractured Horizon', category:'level', difficulty:9, desc:"Un Insane Demon au gameplay ship/wave très technique, avec une déco full glow inspirée des cristaux brisés.", authorId:'u2', gradIdx:0, likes:['u1','u3'], comments:[{id:'c1',authorId:'u3',text:'Le passage wave à 40% est monstrueux, bien joué !',date:'il y a 2 jours'}], views:1240, featured:true, createdAt:'il y a 3 jours' },
    { id:'p2', title:'Meilleurs clics de la semaine #12', category:'clip', desc:'Compilation des runs les plus propres postés par la communauté cette semaine.', authorId:'u3', gradIdx:1, likes:['u2'], comments:[], views:860, featured:false, createdAt:'il y a 1 jour' },
    { id:'p3', title:'100 tentatives sur un Extreme Demon', category:'montage', desc:'De la rage totale au triomphe final en trois minutes.', authorId:'u2', gradIdx:2, likes:['u1','u4'], comments:[{id:'c2',authorId:'u4',text:'La musique colle vraiment bien au montage',date:'il y a 5 heures'}], views:2100, featured:false, createdAt:'il y a 5 jours' },
    { id:'p4', title:"Mise à jour 2.3 : ce qui change pour les créateurs", category:'news', desc:'Nouveaux blocs de décor, éditeur de particules amélioré, et un mode spectateur repensé.', authorId:'u1', gradIdx:3, likes:['u2','u3','u4'], comments:[], views:5400, featured:true, createdAt:'il y a 6 jours' },
    { id:'p5', title:'Maîtriser le timing en mode wave', category:'tuto', desc:'Une série d\'exercices progressifs pour stabiliser votre wave en moins d\'une semaine.', authorId:'u3', gradIdx:4, likes:['u4'], comments:[], views:980, featured:false, createdAt:'il y a 4 jours' },
    { id:'p6', title:'Glass Cathedral', category:'level', difficulty:5, desc:'Niveau Hard au thème vitrail coloré, pensé comme une étape avant les premiers Insane.', authorId:'u4', gradIdx:5, likes:[], comments:[], views:340, featured:false, createdAt:'il y a 1 jour' },
  ],
  currentUserId: null,
  view: 'feed',
  selectedPostId: null,
  filterCat: 'all',
  search: '',
  authOpen: false,
  authMode: 'login',
  editingBio: false,
  toast: null,
};

function currentUser(){ return state.users.find(u=>u.id===state.currentUserId) || null; }
function selectedPost(){ return state.posts.find(p=>p.id===state.selectedPostId) || null; }
function showToast(msg){ state.toast = msg; rerender(); setTimeout(()=>{ state.toast=null; rerender(); }, 2200); }

/* ---------- render helpers ---------- */
function avatarHtml(username, size, big){
  const s = size || 32;
  return `<div class="avatar" style="width:${s}px;height:${s}px;font-size:${big?16:11}px;">${esc(username.slice(0,2).toUpperCase())}</div>`;
}
function roleBadge(role){
  return role==='admin' ? icon('crown','cat-amber') : '';
}

function postCardHtml(post){
  const meta = CATEGORIES[post.category];
  const author = state.users.find(u=>u.id===post.authorId);
  const engagement = post.views ? Math.min(100, Math.max(6, Math.round((post.likes.length/Math.max(post.views,1))*800))) : 6;
  return `
  <div class="card" data-action="open-post" data-id="${post.id}">
    ${post.featured ? `<div class="card-feature">À LA UNE</div>` : ''}
    <div class="card-thumb" style="background:${THUMB_GRADS[post.gradIdx]}">
      ${icon(meta.icon)}
      <span class="badge badge-left">${icon(meta.icon)} ${meta.label}</span>
      ${post.category==='level' ? `<span class="badge badge-right ${difficultyMeta(post.difficulty).cls}">${difficultyMeta(post.difficulty).label}</span>` : ''}
    </div>
    <div class="card-body">
      <p class="card-title">${esc(post.title)}</p>
      <div class="card-author">${avatarHtml(author?author.username:'?',20)} <span>${esc(author?author.username:'Inconnu')}</span><span>·</span><span>${esc(post.createdAt)}</span></div>
      <div class="card-stats">
        <span>${icon('eye')} ${formatCount(post.views)}</span>
        <span>${icon('heart')} ${formatCount(post.likes.length)}</span>
        <span>${icon('message')} ${formatCount(post.comments.length)}</span>
      </div>
      <div class="progress"><div class="progress-fill cat-${meta.color}" style="width:${engagement}%;background:currentColor;"></div></div>
    </div>
  </div>`;
}

function feedHtml(){
  const filtered = state.posts
    .filter(p => state.filterCat==='all' ? true : p.category===state.filterCat)
    .filter(p => state.search.trim() ? (p.title+p.desc).toLowerCase().includes(state.search.toLowerCase()) : true);
  const chips = `<button class="chip ${state.filterCat==='all'?'active light':''}" data-action="filter-cat" data-cat="all">Tout</button>` +
    Object.entries(CATEGORIES).map(([key,meta]) => `<button class="chip ${state.filterCat===key?'active catbg-'+meta.color:''}" data-action="filter-cat" data-cat="${key}">${icon(meta.icon)} ${meta.label}</button>`).join('');
  return `
  <div class="feed-head">
    <h1>Le fil de la communauté</h1>
    <p>Niveaux, clips, montages et actus partagés par les joueurs de CubeCrew.</p>
  </div>
  <div class="controls">
    <div class="search-box">${icon('search')}<input id="search-input" placeholder="Rechercher une publication..." value="${esc(state.search)}"></div>
    <div class="chips">${chips}</div>
  </div>
  ${filtered.length===0 ? `<div class="empty">Aucune publication ne correspond à ta recherche.</div>` :
    `<div class="grid">${filtered.map(postCardHtml).join('')}</div>`}
  `;
}

function postDetailHtml(){
  const post = selectedPost();
  if(!post) return `<div class="empty">Publication introuvable.</div>`;
  const meta = CATEGORIES[post.category];
  const author = state.users.find(u=>u.id===post.authorId);
  const cu = currentUser();
  const liked = cu && post.likes.includes(cu.id);
  const canManage = cu && (cu.role==='admin' || cu.id===post.authorId);
  const commentsHtml = post.comments.length===0
    ? `<p style="color:var(--muted2);font-size:13px;">Aucun commentaire pour le moment. Sois le premier à réagir.</p>`
    : post.comments.map(c => {
        const ca = state.users.find(u=>u.id===c.authorId);
        return `<div class="comment">${avatarHtml(ca?ca.username:'?',32)}<div><div><span class="comment-name">${esc(ca?ca.username:'Inconnu')}</span><span class="comment-date">${esc(c.date)}</span></div><p class="comment-text">${esc(c.text)}</p></div></div>`;
      }).join('');
  return `
  <div class="wrap-mid" style="margin:0 auto;">
    <button class="back-link" data-action="go-feed">${icon('arrowLeft')} Retour au fil</button>
    <div class="detail-hero" style="background:${THUMB_GRADS[post.gradIdx]}">
      ${icon(meta.icon)}
      <span class="badge badge-left">${icon(meta.icon)} ${meta.label}</span>
      ${post.category==='level' ? `<span class="badge badge-right ${difficultyMeta(post.difficulty).cls}">${difficultyMeta(post.difficulty).label} · ${post.difficulty}/10</span>` : ''}
    </div>
    <div class="detail-title-row">
      <div>
        <h1>${esc(post.title)}</h1>
        <div class="detail-meta">${avatarHtml(author?author.username:'?',24)} <strong style="color:var(--text);">${esc(author?author.username:'Inconnu')}</strong> ${roleBadge(author?author.role:'')} <span>·</span> <span>${esc(post.createdAt)}</span></div>
      </div>
      ${canManage ? `<button class="btn btn-danger btn-sm" data-action="delete-post" data-id="${post.id}">${icon('trash')} Supprimer</button>` : ''}
    </div>
    <p class="detail-desc">${esc(post.desc)}</p>
    <div class="detail-actions">
      <button class="like-btn ${liked?'liked':''}" data-action="toggle-like" data-id="${post.id}">${icon('heart', liked?'':'')} ${formatCount(post.likes.length)}</button>
      <span class="stat-inline">${icon('eye')} ${formatCount(post.views)} vues</span>
      <span class="stat-inline">${icon('message')} ${post.comments.length}</span>
    </div>
    <div class="comments">
      <h2>Commentaires</h2>
      <div style="margin-bottom:18px;">${commentsHtml}</div>
      ${cu ? `<div class="comment-form"><input id="comment-input" placeholder="Ajouter un commentaire..." data-postid="${post.id}"><button class="btn btn-primary" data-action="add-comment" data-id="${post.id}">${icon('send')}</button></div>`
           : `<button class="link-btn" data-action="open-auth">Connecte-toi pour commenter</button>`}
    </div>
  </div>`;
}

function uploadHtml(){
  const cu = currentUser();
  if(!cu){
    return `<div class="wrap-narrow" style="text-align:center;padding:80px 0;"><p style="color:var(--muted);margin-bottom:16px;">Connecte-toi pour publier sur CubeCrew.</p><button class="btn btn-primary" data-action="open-auth">Se connecter</button></div>`;
  }
  const catOpts = Object.entries(CATEGORIES).map(([key,meta],i) => `<button class="cat-opt ${i===0?'active catbg-'+meta.color:''}" data-action="select-upload-cat" data-cat="${key}" data-color="${meta.color}">${icon(meta.icon)} ${meta.label}</button>`).join('');
  const gradOpts = THUMB_GRADS.map((g,i) => `<button class="swatch ${i===0?'active':''}" data-action="select-upload-grad" data-idx="${i}" style="background:${g}"></button>`).join('');
  return `
  <div class="wrap-narrow" style="margin:0 auto;" id="upload-form" data-cat="level" data-grad="0">
    <h1 class="font-display" style="font-size:24px;margin:0 0 4px;">Publier</h1>
    <p style="color:var(--muted);font-size:13px;margin:0 0 24px;">Partage un niveau, un clip, un montage, une actu ou un tuto avec la communauté.</p>
    <div class="field"><label class="field-label">Titre</label><input id="f-title" placeholder="Nom de ta publication"></div>
    <div class="field"><label class="field-label">Catégorie</label><div class="cat-picker">${catOpts}</div></div>
    <div class="field" id="diff-field"><label class="field-label">Difficulté — <span id="diff-label" class="diff-yellow">Difficile (5/10)</span></label><input type="range" min="1" max="10" value="5" id="diff-range"></div>
    <div class="field"><label class="field-label">Couleur de la miniature</label><div class="grad-picker">${gradOpts}</div></div>
    <div class="field"><label class="field-label">Description</label><textarea id="f-desc" rows="4" placeholder="Décris ta publication..."></textarea></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;" data-action="submit-post">${icon('plus')} Publier</button>
  </div>`;
}

function profileHtml(){
  const cu = currentUser();
  if(!cu){
    return `<div class="wrap-narrow" style="text-align:center;padding:80px 0;"><p style="color:var(--muted);margin-bottom:16px;">Connecte-toi pour voir ton espace.</p><button class="btn btn-primary" data-action="open-auth">Se connecter</button></div>`;
  }
  const mine = state.posts.filter(p=>p.authorId===cu.id);
  const totalLikes = mine.reduce((s,p)=>s+p.likes.length,0);
  const totalViews = mine.reduce((s,p)=>s+p.views,0);
  const bioBlock = state.editingBio
    ? `<div style="display:flex;gap:8px;width:100%;"><input id="bio-input" value="${esc(cu.bio)}" style="flex:1;"><button class="btn btn-primary btn-sm" data-action="save-bio">Enregistrer</button></div>`
    : `<p>${esc(cu.bio) || 'Aucune bio pour le moment.'}</p><button class="link-btn" data-action="edit-bio">Modifier</button>`;
  const postsBlock = mine.length===0
    ? `<p style="color:var(--muted2);font-size:13px;">Tu n'as encore rien publié. <button class="link-btn" data-action="go-upload">Publie ton premier contenu</button>.</p>`
    : `<div class="grid">${mine.map(p => `<div class="mini-card">${postCardHtml(p)}<button class="del" data-action="delete-post" data-id="${p.id}">${icon('trash')}</button></div>`).join('')}</div>`;
  return `
  <div class="wrap-mid" style="margin:0 auto;">
    <div class="profile-head">
      <div class="profile-avatar">${esc(cu.username.slice(0,2).toUpperCase())}</div>
      <div><div class="profile-name">${esc(cu.username)} ${roleBadge(cu.role)}</div><div class="profile-joined">Membre depuis ${esc(cu.joined)}</div></div>
    </div>
    <div class="bio-row">${bioBlock}</div>
    <div class="stats-row">
      <div class="stat-card"><div class="num">${mine.length}</div><div class="lbl">Publications</div></div>
      <div class="stat-card"><div class="num">${formatCount(totalLikes)}</div><div class="lbl">J'aime reçus</div></div>
      <div class="stat-card"><div class="num">${formatCount(totalViews)}</div><div class="lbl">Vues totales</div></div>
    </div>
    <h2 class="section-title">Mes publications</h2>
    ${postsBlock}
  </div>`;
}

function adminHtml(){
  const cu = currentUser();
  if(!cu || cu.role!=='admin') return `<div class="empty">Accès réservé aux administrateurs.</div>`;
  const totalComments = state.posts.reduce((s,p)=>s+p.comments.length,0);
  const banned = state.users.filter(u=>u.banned).length;
  const userRows = state.users.map(u => `
    <tr>
      <td><div class="row-user">${avatarHtml(u.username,24)} <span>${esc(u.username)}</span> ${u.id===cu.id?'<span style="color:var(--muted2);font-size:11px;">(toi)</span>':''}</div></td>
      <td><span class="${u.role==='admin'?'cat-amber':''}" style="font-weight:600;display:flex;align-items:center;gap:4px;">${u.role==='admin'?icon('crown'):''} ${u.role==='admin'?'Admin':'Utilisateur'}</span></td>
      <td><span style="font-weight:600;color:${u.banned?'var(--red)':'var(--emerald)'};">${u.banned?'Banni':'Actif'}</span></td>
      <td class="actions-cell">
        <button class="btn btn-sm" ${u.id===cu.id?'disabled':''} data-action="toggle-role" data-id="${u.id}">${u.role==='admin'?'Rétrograder':'Promouvoir'}</button>
        <button class="btn btn-sm ${u.banned?'':'btn-danger'}" ${u.id===cu.id?'disabled':''} data-action="toggle-ban" data-id="${u.id}">${u.banned?'Débannir':'Bannir'}</button>
        <button class="btn btn-sm" ${u.id===cu.id?'disabled':''} data-action="delete-user" data-id="${u.id}">Supprimer</button>
      </td>
    </tr>`).join('');
  const postRows = state.posts.map(p => {
    const author = state.users.find(u=>u.id===p.authorId);
    const meta = CATEGORIES[p.category];
    return `<tr>
      <td><button class="link-btn" data-action="open-post" data-id="${p.id}" style="color:var(--text);">${esc(p.title)}</button></td>
      <td style="color:var(--muted);">${esc(author?author.username:'Inconnu')}</td>
      <td><span class="cat-${meta.color}">${meta.label}</span></td>
      <td style="color:var(--muted);">${formatCount(p.views)}</td>
      <td style="color:var(--muted);">${p.likes.length}</td>
      <td class="actions-cell">
        <button class="btn btn-sm" data-action="toggle-featured" data-id="${p.id}">${p.featured?'Retirer de la une':'Mettre à la une'}</button>
        <button class="btn btn-sm" data-action="delete-post" data-id="${p.id}">Supprimer</button>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="wrap" style="margin:0 auto;padding:0;">
    <div class="admin-title">${icon('shield','cat-cyan')} Panel administrateur</div>
    <div class="admin-stats">
      <div class="astat">${icon('users')}<div class="num">${state.users.length}</div><div class="lbl">Utilisateurs</div></div>
      <div class="astat">${icon('fileText')}<div class="num">${state.posts.length}</div><div class="lbl">Publications</div></div>
      <div class="astat">${icon('message')}<div class="num">${totalComments}</div><div class="lbl">Commentaires</div></div>
      <div class="astat">${icon('userX')}<div class="num">${banned}</div><div class="lbl">Comptes bannis</div></div>
    </div>
    <h2 class="section-title">Utilisateurs</h2>
    <div class="table-wrap"><table><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Statut</th><th style="text-align:right;">Actions</th></tr></thead><tbody>${userRows}</tbody></table></div>
    <h2 class="section-title">Publications</h2>
    <div class="table-wrap"><table><thead><tr><th>Titre</th><th>Auteur</th><th>Catégorie</th><th>Vues</th><th>J'aime</th><th style="text-align:right;">Actions</th></tr></thead><tbody>${postRows}</tbody></table></div>
  </div>`;
}

function authModalHtml(){
  if(!state.authOpen) return '';
  const available = state.users.filter(u=>!u.banned);
  const body = state.authMode==='login'
    ? `<p class="hint">Démo : choisis un compte pour te connecter instantanément.</p>` +
      available.map(u => `<button class="acct-row" data-action="login" data-id="${u.id}">${avatarHtml(u.username,32)}<div><div class="acct-name">${esc(u.username)} ${roleBadge(u.role)}</div><div class="acct-sub">${u.role==='admin'?'Compte administrateur':'Compte utilisateur'}</div></div></button>`).join('')
    : `<label class="field-label">Nom d'utilisateur</label><input id="signup-input" placeholder="Ton pseudo" style="width:100%;margin-bottom:16px;"><button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="signup">Créer mon compte</button>`;
  return `
  <div class="overlay" data-action="close-auth">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-x" data-action="close-auth">${icon('x')}</button>
      <div class="tabs2">
        <button class="tab2 ${state.authMode==='login'?'active':''}" data-action="auth-tab" data-mode="login">Connexion</button>
        <button class="tab2 ${state.authMode==='signup'?'active':''}" data-action="auth-tab" data-mode="signup">Inscription</button>
      </div>
      ${body}
    </div>
  </div>`;
}

function headerHtml(){
  const cu = currentUser();
  return `
  <header><div class="wrap bar">
    <button class="logo" data-action="go-feed"><div class="logo-box">${icon('box')}</div><span class="font-display">CubeCrew</span></button>
    <div class="hdr-actions">
      ${cu ? `<button class="btn btn-primary btn-sm hide-sm" data-action="go-upload">${icon('plus')} Publier</button>` : ''}
      ${cu && cu.role==='admin' ? `<button class="btn btn-sm ${state.view==='admin'?'btn-light':''}" data-action="go-admin">${icon('shield')} <span class="hide-sm">Admin</span></button>` : ''}
      ${cu ? `<button data-action="go-profile">${avatarHtml(cu.username,32)}</button><button class="icon-btn" data-action="logout" title="Se déconnecter">${icon('logout')}</button>`
           : `<button class="btn btn-light btn-sm" data-action="open-auth">${icon('login')} Se connecter</button>`}
    </div>
  </div></header>`;
}

function render(){
  const cu = currentUser();
  let mainContent;
  if(state.view==='feed') mainContent = feedHtml();
  else if(state.view==='post') mainContent = postDetailHtml();
  else if(state.view==='upload') mainContent = uploadHtml();
  else if(state.view==='profile') mainContent = profileHtml();
  else if(state.view==='admin') mainContent = adminHtml();
  else mainContent = feedHtml();

  document.getElementById('root').innerHTML = `
    ${headerHtml()}
    <main class="wrap">${mainContent}</main>
    <footer>CubeCrew — un prototype front-end pour la communauté Geometry Dash. Les données sont réinitialisées au rechargement.</footer>
    ${authModalHtml()}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
}

function rerender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  render();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
    }
  }
}

/* ---------- actions ---------- */
function goFeed(){ state.view='feed'; state.selectedPostId=null; rerender(); }
function openPost(id){ state.view='post'; state.selectedPostId=id; rerender(); }

function doLogin(id){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  if(u.banned){ showToast('Ce compte est banni et ne peut pas se connecter.'); return; }
  state.currentUserId = u.id; state.authOpen=false;
  rerender(); showToast(`Connecté en tant que ${u.username}`);
}
function doSignup(){
  const val = (document.getElementById('signup-input')||{}).value || '';
  const name = val.trim();
  if(!name){ showToast("Choisis un nom d'utilisateur."); return; }
  if(state.users.some(u=>u.username.toLowerCase()===name.toLowerCase())){ showToast('Ce nom est déjà pris.'); return; }
  const id = uid('u');
  state.users.push({ id, username:name, role:'user', bio:'', banned:false, joined:'2026' });
  state.currentUserId = id; state.authOpen=false;
  rerender(); showToast(`Bienvenue sur CubeCrew, ${name} !`);
}
function doLogout(){ state.currentUserId=null; goFeed(); }

function toggleLike(id){
  const cu = currentUser();
  if(!cu){ state.authOpen=true; state.authMode='login'; rerender(); return; }
  const post = state.posts.find(p=>p.id===id);
  if(!post) return;
  const has = post.likes.includes(cu.id);
  post.likes = has ? post.likes.filter(x=>x!==cu.id) : [...post.likes, cu.id];
  rerender();
}
function addComment(postId){
  const cu = currentUser();
  if(!cu){ state.authOpen=true; state.authMode='login'; rerender(); return; }
  const input = document.getElementById('comment-input');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const post = state.posts.find(p=>p.id===postId);
  if(!post) return;
  post.comments.push({ id:uid('c'), authorId:cu.id, text, date:"à l'instant" });
  rerender();
}
function deletePost(id){
  state.posts = state.posts.filter(p=>p.id!==id);
  if(state.selectedPostId===id){ state.view='feed'; state.selectedPostId=null; }
  rerender(); showToast('Publication supprimée.');
}
function toggleFeatured(id){
  const post = state.posts.find(p=>p.id===id);
  if(post){ post.featured = !post.featured; rerender(); }
}
function toggleBan(id){
  const cu = currentUser();
  if(id===cu.id){ showToast('Tu ne peux pas te bannir toi-même.'); return; }
  const u = state.users.find(x=>x.id===id);
  if(u){ u.banned = !u.banned; rerender(); }
}
function toggleRole(id){
  const cu = currentUser();
  if(id===cu.id){ showToast('Tu ne peux pas changer ton propre rôle.'); return; }
  const u = state.users.find(x=>x.id===id);
  if(u){ u.role = u.role==='admin' ? 'user' : 'admin'; rerender(); }
}
function deleteUser(id){
  const cu = currentUser();
  if(id===cu.id){ showToast('Tu ne peux pas supprimer ton propre compte ici.'); return; }
  state.users = state.users.filter(u=>u.id!==id);
  state.posts = state.posts.filter(p=>p.authorId!==id);
  rerender(); showToast('Compte supprimé.');
}
function saveBio(){
  const cu = currentUser();
  const input = document.getElementById('bio-input');
  if(cu && input){ cu.bio = input.value; }
  state.editingBio = false; rerender();
}
function submitPost(){
  const cu = currentUser();
  if(!cu) return;
  const form = document.getElementById('upload-form');
  const title = (document.getElementById('f-title')||{}).value || '';
  const desc = (document.getElementById('f-desc')||{}).value || '';
  const cat = form ? form.dataset.cat : 'level';
  const gradIdx = form ? parseInt(form.dataset.grad,10) : 0;
  const diff = document.getElementById('diff-range') ? parseInt(document.getElementById('diff-range').value,10) : 5;
  if(!title.trim()){ showToast('Donne un titre à ta publication.'); return; }
  const id = uid('p');
  const post = { id, title:title.trim(), category:cat, desc: desc.trim() || 'Pas de description.', authorId:cu.id, gradIdx, likes:[], comments:[], views:0, featured:false, createdAt:"à l'instant" };
  if(cat==='level') post.difficulty = diff;
  state.posts.unshift(post);
  openPost(id);
  showToast('Publication mise en ligne !');
}

/* ---------- event delegation ---------- */
const root = document.getElementById('root');

root.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  switch(action){
    case 'go-feed': goFeed(); break;
    case 'open-post': openPost(id); break;
    case 'go-upload': state.view='upload'; rerender(); break;
    case 'go-profile': state.view='profile'; rerender(); break;
    case 'go-admin': state.view='admin'; rerender(); break;
    case 'open-auth': state.authOpen=true; state.authMode='login'; rerender(); break;
    case 'close-auth': state.authOpen=false; rerender(); break;
    case 'auth-tab': state.authMode=t.dataset.mode; rerender(); break;
    case 'login': doLogin(id); break;
    case 'signup': doSignup(); break;
    case 'logout': doLogout(); break;
    case 'toggle-like': toggleLike(id); break;
    case 'add-comment': addComment(id); break;
    case 'delete-post': deletePost(id); break;
    case 'toggle-featured': toggleFeatured(id); break;
    case 'toggle-ban': toggleBan(id); break;
    case 'toggle-role': toggleRole(id); break;
    case 'delete-user': deleteUser(id); break;
    case 'edit-bio': state.editingBio=true; rerender(); break;
    case 'save-bio': saveBio(); break;
    case 'filter-cat': state.filterCat=t.dataset.cat; rerender(); break;
    case 'submit-post': submitPost(); break;
    case 'select-upload-cat': {
      const form = document.getElementById('upload-form');
      form.dataset.cat = t.dataset.cat;
      form.querySelectorAll('.cat-opt').forEach(b=>{ b.classList.remove('active','catbg-cyan','catbg-pink','catbg-violet','catbg-amber','catbg-emerald'); });
      t.classList.add('active','catbg-'+t.dataset.color);
      document.getElementById('diff-field').style.display = (t.dataset.cat==='level') ? '' : 'none';
      break;
    }
    case 'select-upload-grad': {
      const form = document.getElementById('upload-form');
      form.dataset.grad = t.dataset.idx;
      form.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));
      t.classList.add('active');
      break;
    }
  }
});

root.addEventListener('input', (e) => {
  if(e.target.id === 'search-input'){ state.search = e.target.value; rerender(); }
  if(e.target.id === 'diff-range'){
    const v = parseInt(e.target.value,10);
    const lbl = document.getElementById('diff-label');
    const meta = difficultyMeta(v);
    lbl.textContent = `${meta.label} (${v}/10)`;
    lbl.className = meta.cls;
  }
});

root.addEventListener('keydown', (e) => {
  if(e.key==='Enter' && e.target.id==='comment-input'){ addComment(e.target.dataset.postid); }
  if(e.key==='Enter' && e.target.id==='signup-input'){ doSignup(); }
});

render();
</script>
</body>
</html>
